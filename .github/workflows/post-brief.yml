name: Post desk brief to Discord

# Why this exists:
# The scheduled cloud routine that generates the First Sign brief runs in a sandbox
# whose egress proxy blocks discord.com with a standing 403 policy denial. GitHub
# Actions runners have unrestricted egress, so the routine commits the brief and this
# workflow relays it to Discord.
#
# Requires repo secret DISCORD_WEBHOOK_URL
#   Settings -> Secrets and variables -> Actions -> New repository secret

on:
  push:
    paths:
      - 'firstsign/**.md'
  workflow_dispatch:
    inputs:
      file:
        description: 'Markdown file to post (e.g. firstsign/first_sign_20260729.md)'
        required: true
        type: string

# Two pushes in quick succession shouldn't post twice over the top of each other.
concurrency:
  group: post-brief
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need HEAD^ to diff what this push changed

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Post brief(s) to Discord
        env:
          # Passed as env, never interpolated into the shell — ${{ }} inside a run
          # block is a script-injection vector.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MANUAL_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -n "${MANUAL_FILE:-}" ]; then
            FILES="$MANUAL_FILE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD^ HEAD -- 'firstsign/*.md' || true)
          else
            FILES=$(git ls-files 'firstsign/*.md')
          fi

          if [ -z "${FILES// /}" ]; then
            echo "No brief files changed in this push - nothing to post."
            exit 0
          fi

          echo "Posting:"
          echo "$FILES"

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "::warning::$f not found in checkout (deleted?) - skipping"
              continue
            fi
            # Turn first_sign_20260729.md into a readable title.
            base=$(basename "$f" .md)
            date_part=$(echo "$base" | grep -oE '[0-9]{8}$' || true)
            if [ -n "$date_part" ]; then
              title="First Sign - ${date_part:0:4}-${date_part:4:2}-${date_part:6:2}"
            else
              title="Desk brief - $base"
            fi
            echo "--- $f  ->  $title"
            python3 scripts/post_discord.py "$f" --title "$title"
          done <<< "$FILES"
